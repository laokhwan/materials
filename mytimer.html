<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8eb">
  <meta name="description" content="เกมกะเวลา แตะเพื่อเริ่มและแตะอีกครั้งเพื่อหยุด">
  <title>How Long Is One Minute?</title>
  <style>
    :root{--ink:#17233b;--paper:#fff8eb;--accent:#f25b38;--dark:#d94124}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}button{font:inherit}.shell{height:100svh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(26px,calc(env(safe-area-inset-bottom) + 14px));overflow:hidden}.game{position:relative;flex:1;min-height:0;width:100%;border:0;border-radius:34px;overflow:hidden;color:inherit;background:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.game:before,.game:after{content:"";position:absolute;border:2px solid #f25b381f;border-radius:50%;width:46vw;height:46vw;max-width:420px;max-height:420px}.game:before{top:-28vw;right:-20vw}.game:after{bottom:-33vw;left:-21vw}.game:focus-visible{outline:4px solid #f25b3859;outline-offset:-4px}.game:disabled{cursor:default;opacity:1}.eyebrow{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:100%;font-size:clamp(.68rem,2.8vw,.8rem);font-weight:800;letter-spacing:.2em}.content{position:absolute;inset:58px 22px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}h1{margin:28px 0 12px;font-size:clamp(2.65rem,13vw,6.4rem);line-height:.95;letter-spacing:-.055em;font-weight:850}p{margin:0;font-size:clamp(1.05rem,4.8vw,1.45rem);color:#596176}.timer{width:108px;height:108px;border:9px solid var(--accent);border-radius:50%;position:relative;box-shadow:0 13px 0 #f25b381f}.timer:before{content:"";position:absolute;width:30px;height:10px;background:var(--accent);border-radius:6px;top:-18px;left:30px}.timer:after{content:"";position:absolute;width:8px;height:32px;background:var(--accent);border-radius:5px;left:41px;top:16px;transform-origin:4px 30px;transform:rotate(40deg)}.hint{margin-top:42px;padding:14px 28px;background:var(--accent);color:#fff;border-radius:999px;font-weight:800;box-shadow:0 9px 0 var(--dark)}.game:active .hint{transform:translateY(4px);box-shadow:0 5px 0 var(--dark)}.pulse{width:104px;height:104px;border-radius:50%;background:#f25b381f;display:grid;place-items:center;animation:breathe 1.8s ease-in-out infinite}.pulse:after{content:"";width:48px;height:48px;border-radius:50%;background:var(--accent)}.running h1{font-size:clamp(2.7rem,12vw,6rem)}.label{font-size:.9rem;font-weight:800;letter-spacing:.16em;color:var(--accent)}output{display:block;margin-top:20px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:clamp(2.55rem,12vw,7rem);font-weight:800;letter-spacing:-.07em;white-space:nowrap}.reset{flex:0 0 auto;min-height:56px;margin-top:10px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-weight:800;font-size:1.08rem;cursor:pointer;-webkit-tap-highlight-color:transparent}.reset:active{transform:scale(.985)}[hidden]{display:none!important}@keyframes breathe{50%{transform:scale(1.14);background:#f25b3833}}@media(max-height:650px){.content{inset:45px 18px 12px}.timer,.pulse{transform:scale(.75)}h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4rem)}.hint{margin-top:20px}}@media(min-width:700px){.shell{max-width:900px;margin:auto;padding:28px}.game{border:1px solid #17233b14;box-shadow:0 24px 80px #17233b17}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
</head>
<body>
  <main class="shell">
    <button id="game" class="game" type="button" aria-label="แตะเพื่อเริ่มจับเวลา">
      <span class="eyebrow">HOW LONG IS ONE MINUTE?</span>
      <section id="ready" class="content"><span class="timer" aria-hidden="true"></span><h1>หนึ่งนาที<br>นานแค่ไหน?</h1><p>แตะหน้าจอเพื่อเริ่มจับเวลา</p><span class="hint" aria-hidden="true">แตะเพื่อเริ่ม</span></section>
      <section id="running" class="content running" aria-live="polite" hidden><span class="pulse" aria-hidden="true"></span><h1>กำลังจับเวลา…</h1><p>แตะหน้าจอเพื่อหยุด</p></section>
      <section id="finished" class="content" aria-live="polite" hidden><span class="label">เวลาของคุณ</span><output id="result">00:00.000</output></section>
    </button>
    <button id="reset" class="reset" type="button" hidden>เล่นอีกครั้ง</button>
  </main>
  <script>
    (()=>{const game=document.querySelector('#game'),ready=document.querySelector('#ready'),running=document.querySelector('#running'),finished=document.querySelector('#finished'),result=document.querySelector('#result'),reset=document.querySelector('#reset');let state='ready',started=0;const show=id=>{ready.hidden=id!=='ready';running.hidden=id!=='running';finished.hidden=id!=='finished'};const format=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=ms%1000;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(x).padStart(3,'0')}`};game.addEventListener('click',()=>{if(state==='ready'){started=performance.now();state='running';show(state);game.setAttribute('aria-label','แตะเพื่อหยุดจับเวลา')}else if(state==='running'){result.textContent=format(Math.round(performance.now()-started));state='finished';show(state);game.disabled=true;reset.hidden=false}});reset.addEventListener('click',()=>{state='ready';show(state);game.disabled=false;game.setAttribute('aria-label','แตะเพื่อเริ่มจับเวลา');reset.hidden=true;result.textContent='00:00.000'})})();
  </script>
</body>
</html>
